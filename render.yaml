services:
  - type: web
    name: nexus-arcade-os
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Deploy only after GitHub Actions CI is green.
    autoDeployTrigger: checksPass
    envVars:
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: '1'
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
